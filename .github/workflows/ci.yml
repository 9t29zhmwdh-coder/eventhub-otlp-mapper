name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Every package comes from requirements/ci.txt with its hash checked;
      # eventhub-otlp-mapper itself is installed without resolving anything further.
      - name: Install pinned dependencies and tools
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lock file matches pyproject.toml
        run: |
          cp requirements/ci.txt fresh.txt
          uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.12 --generate-hashes -q --custom-compile-command "uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.12 --generate-hashes -o requirements/ci.txt" -o fresh.txt
          diff requirements/ci.txt fresh.txt

      - name: Dependency audit (pip-audit)
        run: pip-audit --skip-editable

      - name: Lint
        run: ruff check --select E9,F821,F822,F823 --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
